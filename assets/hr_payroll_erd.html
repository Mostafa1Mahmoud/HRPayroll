
<style>
#erd svg { width: 100%; }
</style>
<div id="erd" style="padding: 1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  Company ||--o{ Branch : has
  Company ||--o{ Department : has
  Company ||--o{ LeavePolicy : defines
  Company ||--o{ PayrollRun : runs
  Company ||--o{ User : belongs_to

  User ||--o| Employee : is

  Department ||--o{ Employee : contains
  Branch ||--o{ Employee : located_at
  JobTitle }o--|| Grade : belongs_to
  Employee }o--|| JobTitle : holds

  Employee ||--o{ EmploymentHistory : has
  Employee ||--o{ Document : has
  Employee ||--o{ LeaveBalance : has
  Employee ||--o{ LeaveRequest : submits
  Employee ||--o{ AttendanceRecord : has
  Employee ||--o{ OneTimeAdjustment : receives
  Employee ||--o{ Payslip : receives
  Employee }o--|| SalaryStructure : assigned

  LeaveType ||--o{ LeaveBalance : tracks
  LeaveType ||--o{ LeaveRequest : of_type
  LeaveType ||--o{ LeavePolicy : governs

  SalaryStructure ||--o{ SalaryStructureComponent : contains
  SalaryComponent ||--o{ SalaryStructureComponent : used_in

  PayrollRun ||--o{ Payslip : generates
  Payslip ||--o{ PayslipLine : has

  Company {
    uuid id PK
    string name
    string logoUrl
  }
  Branch {
    uuid id PK
    uuid companyId FK
    string name
    string address
  }
  Department {
    uuid id PK
    uuid companyId FK
    uuid managerId FK
    string name
  }
  Grade {
    uuid id PK
    string name
    decimal minSalary
    decimal maxSalary
  }
  JobTitle {
    uuid id PK
    uuid gradeId FK
    string name
  }
  User {
    uuid id PK
    uuid companyId FK
    string email
    string firstName
    string lastName
    enum role
  }
  Employee {
    uuid id PK
    uuid userId FK
    uuid departmentId FK
    uuid branchId FK
    uuid jobTitleId FK
    uuid salaryStructureId FK
    string employeeCode
    date hireDate
    enum status
  }
  EmploymentHistory {
    uuid id PK
    uuid employeeId FK
    enum changeType
    string oldValue
    string newValue
    date effectiveDate
  }
  Document {
    uuid id PK
    uuid employeeId FK
    enum type
    string fileUrl
    date expiryDate
  }
  LeaveType {
    uuid id PK
    string name
    int defaultDaysPerYear
    bool isPaid
  }
  LeavePolicy {
    uuid id PK
    uuid companyId FK
    uuid leaveTypeId FK
    uuid gradeId FK
    int allowedDays
  }
  LeaveBalance {
    uuid id PK
    uuid employeeId FK
    uuid leaveTypeId FK
    int year
    int totalDays
    int usedDays
  }
  LeaveRequest {
    uuid id PK
    uuid employeeId FK
    uuid leaveTypeId FK
    date startDate
    date endDate
    int totalDays
    enum status
  }
  AttendanceRecord {
    uuid id PK
    uuid employeeId FK
    date date
    time checkIn
    time checkOut
    enum status
  }
  SalaryComponent {
    uuid id PK
    string name
    enum type
    enum calculationType
  }
  SalaryStructure {
    uuid id PK
    string name
  }
  SalaryStructureComponent {
    uuid salaryStructureId FK
    uuid salaryComponentId FK
    decimal value
  }
  PayrollRun {
    uuid id PK
    uuid companyId FK
    int month
    int year
    enum status
  }
  Payslip {
    uuid id PK
    uuid payrollRunId FK
    uuid employeeId FK
    decimal basicSalary
    decimal totalAllowances
    decimal totalDeductions
    decimal netSalary
  }
  PayslipLine {
    uuid id PK
    uuid payslipId FK
    string componentName
    enum type
    decimal amount
  }
  OneTimeAdjustment {
    uuid id PK
    uuid employeeId FK
    int month
    int year
    enum type
    decimal amount
    string reason
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
